name: Notify Slack on new issue

on:
  issues:
    types:
      - opened

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Post new issue to Slack
        env:
          SLACK_WORKFLOW_WEBHOOK_URL: ${{ secrets.SLACK_TERRAFORM_REGISTRY_SUPPORT_WORKFLOW_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          REPOSITORY: ${{ github.repository }}
        run: |
          single_line() {
            printf '%s' "$1" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//'
          }

          truncate_text() {
            local value
            value="$1"
            local limit="$2"
            if [ ${#value} -gt "$limit" ]; then
              printf '%s...' "${value:0:$((limit - 3))}"
            else
              printf '%s' "$value"
            fi
          }

          extract_section() {
            local heading="$1"
            local value
            value=$(printf '%s\n' "$ISSUE_BODY" | awk -v heading="### ${heading}" '
              $0 == heading { capture=1; next }
              capture && /^### / { exit }
              capture { lines[++count] = $0 }
              END {
                start = 1
                while (start <= count && lines[start] ~ /^[[:space:]]*$/) start++

                end = count
                while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--

                for (i = start; i <= end; i++) {
                  sub(/[[:space:]]+$/, "", lines[i])
                  print lines[i]
                }
              }
            ')
            printf '%s' "$value"
          }

          extract_section_inline() {
            single_line "$(extract_section "$1")"
          }

          normalized_labels=",${ISSUE_LABELS//, /,},"
          has_label() {
            [[ "$normalized_labels" == *,"$1",* ]]
          }

          if [ -z "$ISSUE_LABELS" ]; then
            labels="none"
          else
            labels="$ISSUE_LABELS"
          fi

          request_type="$(extract_section "Request type")"
          template_kind="generic"
          issue_title_safe="${ISSUE_TITLE//|/-}"
          issue_reference="#${ISSUE_NUMBER} ${issue_title_safe}"
          summary="$(truncate_text "$ISSUE_BODY" 500)"
          registry_url=""
          bug_description=""
          expected_behavior=""
          reproduction=""
          artifact_url=""
          requestor_github=""
          new_owner_github=""
          requested_action=""
          reason=""
          current_repo=""
          new_repo=""
          current_verification=""
          new_verification=""

          if has_label "issue:bug"; then
            template_kind="bug"
          elif has_label "issue:ownership-change"; then
            template_kind="ownership"
          elif has_label "issue:artifact-removal"; then
            template_kind="removal"
          elif has_label "issue:source-repo-change"; then
            template_kind="source-repo-change"
          elif has_label "issue:artifact-management"; then
            case "$request_type" in
              "Change artifact ownership")
                template_kind="ownership"
                ;;
              "Remove artifact from registry")
                template_kind="removal"
                ;;
              "Change provider source repository")
                template_kind="source-repo-change"
                ;;
              *)
                template_kind="artifact-management"
                ;;
            esac
          fi

          case "$template_kind" in
            bug)
              registry_url="$(extract_section_inline "Registry URL")"
              bug_description="$(truncate_text "$(extract_section "Describe the bug")" 220)"
              expected_behavior="$(truncate_text "$(extract_section "Expected behavior")" 180)"
              reproduction="$(truncate_text "$(extract_section "To Reproduce")" 220)"
              summary="Registry URL: ${registry_url:-not provided}\n\nBug:\n${bug_description:-not provided}\n\nExpected:\n${expected_behavior:-not provided}\n\nRepro:\n${reproduction:-not provided}"
              ;;
            ownership)
              artifact_url="$(extract_section_inline "Registry artifact URL")"
              requested_action="$(truncate_text "$(extract_section "Requested action")" 180)"
              reason="$(truncate_text "$(extract_section "Reason for request")" 180)"
              requestor_github="$(extract_section_inline "GitHub username")"
              new_owner_github="$(extract_section_inline "New owner GitHub username")"
              current_verification="$(extract_section_inline "Link to .terraform-registry file")"
              if [ -z "$current_verification" ]; then
                current_verification="$(extract_section_inline "Link to current repository .terraform-registry file")"
              fi
              summary="Artifact: ${artifact_url:-not provided}\nRequestor: ${requestor_github:-not provided}\nNew owner: ${new_owner_github:-not provided}\n\nAction:\n${requested_action:-not provided}\n\nReason:\n${reason:-not provided}\n\nVerification:\n${current_verification:-not provided}"
              ;;
            removal)
              artifact_url="$(extract_section_inline "Registry artifact URL")"
              requested_action="$(truncate_text "$(extract_section "Requested action")" 180)"
              reason="$(truncate_text "$(extract_section "Reason for request")" 180)"
              requestor_github="$(extract_section_inline "GitHub username")"
              current_verification="$(extract_section_inline "Link to .terraform-registry file")"
              if [ -z "$current_verification" ]; then
                current_verification="$(extract_section_inline "Link to current repository .terraform-registry file")"
              fi
              summary="Artifact: ${artifact_url:-not provided}\nRequestor: ${requestor_github:-not provided}\n\nAction:\n${requested_action:-not provided}\n\nReason:\n${reason:-not provided}\n\nVerification:\n${current_verification:-not provided}"
              ;;
            source-repo-change)
              artifact_url="$(extract_section_inline "Registry artifact URL")"
              current_repo="$(extract_section_inline "Current source repository URL")"
              new_repo="$(extract_section_inline "Requested new source repository URL")"
              requested_action="$(truncate_text "$(extract_section "Requested action")" 180)"
              requestor_github="$(extract_section_inline "GitHub username")"
              current_verification="$(extract_section_inline "Link to current repository .terraform-registry file")"
              new_verification="$(extract_section_inline "Link to new repository .terraform-registry file")"
              summary="Artifact: ${artifact_url:-not provided}\nRequestor: ${requestor_github:-not provided}\nCurrent repo: ${current_repo:-not provided}\nRequested repo: ${new_repo:-not provided}\n\nAction:\n${requested_action:-not provided}\n\nVerification:\n- Current: ${current_verification:-not provided}\n- New: ${new_verification:-not provided}"
              ;;
            artifact-management)
              artifact_url="$(extract_section_inline "Registry artifact URL")"
              requested_action="$(truncate_text "$(extract_section "Requested action")" 180)"
              reason="$(truncate_text "$(extract_section "Reason for request")" 180)"
              requestor_github="$(extract_section_inline "GitHub username")"
              current_verification="$(extract_section_inline "Link to current repository .terraform-registry file")"
              new_verification="$(extract_section_inline "Link to new repository .terraform-registry file")"
              summary="Request type: ${request_type:-not provided}\nArtifact: ${artifact_url:-not provided}\nRequestor: ${requestor_github:-not provided}\n\nAction:\n${requested_action:-not provided}\n\nReason:\n${reason:-not provided}\n\nVerification:\n- Current: ${current_verification:-not provided}\n- New: ${new_verification:-not provided}"
              ;;
          esac

          payload=$(jq -n \
            --arg issue_type "$template_kind" \
            --arg repository "$REPOSITORY" \
            --arg issue_reference "$issue_reference" \
            --arg issue_url "$ISSUE_URL" \
            --arg issue_author "$ISSUE_AUTHOR" \
            --arg issue_labels "$labels" \
            --arg summary "$summary" \
            --arg registry_url "$registry_url" \
            --arg bug_description "$bug_description" \
            --arg expected_behavior "$expected_behavior" \
            --arg reproduction "$reproduction" \
            --arg artifact_url "$artifact_url" \
            --arg requestor_github "$requestor_github" \
            --arg new_owner_github "$new_owner_github" \
            --arg requested_action "$requested_action" \
            --arg reason "$reason" \
            --arg current_repo "$current_repo" \
            --arg new_repo "$new_repo" \
            --arg current_verification "$current_verification" \
            --arg new_verification "$new_verification" \
            '{
              issue_type: $issue_type,
              repository: $repository,
              issue_reference: $issue_reference,
              issue_url: $issue_url,
              issue_author: $issue_author,
              issue_labels: $issue_labels,
              issue_summary: $summary,
              registry_url: $registry_url,
              bug_description: $bug_description,
              expected_behavior: $expected_behavior,
              reproduction: $reproduction,
              artifact_url: $artifact_url,
              requestor_github: $requestor_github,
              new_owner_github: $new_owner_github,
              requested_action: $requested_action,
              reason: $reason,
              current_repo: $current_repo,
              new_repo: $new_repo,
              current_verification: $current_verification,
              new_verification: $new_verification
            }')

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WORKFLOW_WEBHOOK_URL"
