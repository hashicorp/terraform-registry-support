name: Public registry artifact management
description: Request ownership changes, removal from the registry, or provider source repository updates for a public registry artifact
title: "[Artifact Management]: "
labels:
  - issue:artifact-management
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request administrative changes for a public registry artifact.

        Before filing, please try organization publishing first. This resolves many publishing and artifact management issues.
        HCP Terraform Public Namespaces: https://developer.hashicorp.com/terraform/cloud-docs/public-namespace

        If you would prefer to make this request in private, please contact us via email at [Terraform.Registry.Support@ibm.com](mailto:Terraform.Registry.Support@ibm.com).
        Be sure to include the same information requested in this form to help us best assist you.

  - type: dropdown
    id: org-publishing-tried
    attributes:
      label: Have you tried organization publishing first?
      description: Organization publishing solves many publishing or artifact management issues.
      options:
        - "Yes, I have already tried organization publishing"
        - "No, I have not tried organization publishing"
    validations:
      required: true

  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      description: Select the administrative change you need.
      options:
        - Change artifact ownership
        - Remove artifact from registry
        - Change provider source repository
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Registry artifact details

  - type: input
    id: artifact-url
    attributes:
      label: Registry artifact URL
      description: Link to the artifact in the registry.
      placeholder: https://registry.terraform.io/...
    validations:
      required: true

  - type: dropdown
    id: artifact-type
    attributes:
      label: Artifact type
      options:
        - Provider
        - Module
        - Other
    validations:
      required: true

  - type: input
    id: current-source-repository-url
    attributes:
      label: Current source repository URL
      placeholder: https://github.com/<org>/<repo>
    validations:
      required: false

  - type: input
    id: requested-new-source-repository-url
    attributes:
      label: Requested new source repository URL
      description: Required for provider source repository change requests.
      placeholder: https://github.com/<org>/<repo>
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Request details

  - type: textarea
    id: requested-action
    attributes:
      label: Requested action
      description: Describe the requested change clearly and concisely.
      placeholder: Change artifact ownership to <user>, remove the artifact from the registry, or update the provider source repository to <repo>.
    validations:
      required: true

  - type: textarea
    id: reason-for-request
    attributes:
      label: Reason for request
      placeholder: Explain why this administrative change is needed.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Requestor details

  - type: input
    id: requestor-name
    attributes:
      label: Requestor name
      placeholder: Jane Doe
    validations:
      required: true

  - type: input
    id: requestor-email
    attributes:
      label: Requestor email
      placeholder: name@example.com
    validations:
      required: true

  - type: input
    id: requestor-github-username
    attributes:
      label: GitHub username
      placeholder: octocat
    validations:
      required: true

  - type: input
    id: new-owner-github-username
    attributes:
      label: New owner GitHub username
      description: Required for ownership change requests only.
      placeholder: new-owner
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Ownership verification requirements

        To protect registry users and publishers, we can only perform administrative changes after verifying ownership of the published artifact.

        For ownership changes or removal from the registry, create a file named `.terraform-registry` in the root of the artifact repository on the default branch with the following contents:

        ```text
        Request: <concisely explain your request, for example: "change owner to user123" or "remove from registry">
        Registry Link: <link to your artifact on the Registry>
        Request by: <the email associated with this request>
        ```

        For provider source repository changes, create a file named `.terraform-registry` in the root of both the current repository and the new repository on the default branch with the following contents:

        ```text
        Request: <concisely explain your request, for example: "change source repo to https://github.com/user123/repo123">
        Registry Link: <link to your artifact on the Registry>
        Request by: <the email associated with this request>
        ```

        After committing the file or files, include links to them in this issue.

  - type: input
    id: current-terraform-registry-file-link
    attributes:
      label: Link to current repository .terraform-registry file
      description: Include a URL to the `.terraform-registry` file at the root of the default branch of the current artifact repository.
      placeholder: https://github.com/<org>/<repo>/blob/<default-branch>/.terraform-registry
    validations:
      required: true

  - type: input
    id: new-terraform-registry-file-link
    attributes:
      label: Link to new repository .terraform-registry file
      description: Required for provider source repository change requests.
      placeholder: https://github.com/<org>/<repo>/blob/<default-branch>/.terraform-registry
    validations:
      required: false

  - type: checkboxes
    id: verification-checklist
    attributes:
      label: Verification checklist
      description: Confirm the items that apply to your request.
      options:
        - label: I have added the `.terraform-registry` file to the default branch of the current artifact repository.
          required: true
        - label: I have added the `.terraform-registry` file to the default branch of the new repository. This is required for source repository changes.
          required: false
        - label: The `Request by` email in the file matches the email associated with this issue.
          required: true
        - label: The registry link above points to the correct public registry artifact.
          required: true
        - label: The new owner has already logged into the registry. This is required for ownership changes.
          required: false

  - type: markdown
    attributes:
      value: |
        ## Additional notes

        No action will be taken until ownership has been verified.
        Changes to artifact details may require direct administrative updates and are handled with extra caution.
        For provider source repository changes, verification can be completed through this issue template, but the internal change process may still require additional follow-up.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other relevant details, links, screenshots, or error messages here.
      placeholder: Include any additional details that will help us review this request.
    validations:
      required: false
